steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 # 或者使用 latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm' # 自动识别 pnpm-lock.yaml 进行缓存

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # 确保版本与 lock 文件完全一致

      - name: Build project
        run: pnpm run build

      - name: Prepare deployment files
        run: |
          mkdir deploy
          cp -r .next/standalone/* ./deploy/
          cp -r public ./deploy/public
          cp -r .next/static ./deploy/.next/static
          tar -czvf deploy.tar.gz -C deploy .

      # ... 后续的 SCP 和 SSH 步骤保持不变 ...