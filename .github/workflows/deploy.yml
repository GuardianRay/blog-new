name: Deploy Next.js to Server

on:
  push:
    branches: [ main ] # 当 main 分支有推送时触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # 在 GitHub 提供的免费 Ubuntu 环境中构建

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare deployment files
        # 这一步将 standalone 模式所需的文件打包
        run: |
          mkdir deploy
          cp -r .next/standalone/* ./deploy/
          cp -r public ./deploy/public
          cp -r .next/static ./deploy/.next/static
          tar -czvf deploy.tar.gz -C deploy .

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/home/blog-new" # 服务器存放路径

      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/blog-new
            tar -xzvf deploy.tar.gz
            # 首次运行使用 pm2 start，后续使用 restart
            pm2 restart nextjs-blog || pm2 start server.js --name "nextjs-blog"
            rm deploy.tar.gz