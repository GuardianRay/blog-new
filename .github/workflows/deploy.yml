name: Deploy Next.js to CentOS

on:
  push:
    branches: [ main ] # 如果你的主分支叫 master，请改为 master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # 匹配你本地的 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        # 使用 --no-frozen-lockfile 解决版本不兼容导致的 absent 报错
        run: pnpm install --no-frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Prepare deployment files
        # 提取 Standalone 模式下的核心文件，减少传输体积
        run: |
          mkdir deploy
          cp -r .next/standalone/* ./deploy/
          cp -r public ./deploy/public
          cp -r .next/static ./deploy/.next/static
          tar -czvf deploy.tar.gz -C deploy .

      - name: Copy files to server via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz"
          target: "/home/blog-new" # 确保服务器上该目录已创建

      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/blog-new
            tar -xzvf deploy.tar.gz
            # 自动重启或启动 PM2 进程
            # 这里的 server.js 是 Next.js standalone 模式生成的入口文件
            pm2 restart nextjs-blog || pm2 start server.js --name "nextjs-blog"
            rm deploy.tar.gz